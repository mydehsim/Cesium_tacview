<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="cesiumContainer"></div>
    
    <!-- Toggle button for control panel -->
    <button id="toggleControlPanel" class="toggle-control-panel" title="Toggle Route Configuration">
      ☰
    </button>
    
    <!-- Object Management button -->
    <button id="toggleObjectPanel" class="toggle-object-panel" title="Object Management">
      🎯
    </button>
    
    <!-- Right-side entity selector panel with integrated info -->
    <div id="entitySelector" class="entity-selector">
      <h3>Entities</h3>
      <div id="entityList"></div>
    </div>
    
    <!-- Control panel for route configuration - collapsible from left -->
    <div id="controlPanel" class="control-panel">
      <h3>
        Route Configuration
        <button id="closePanel" class="close-panel-btn" title="Close Panel">×</button>
      </h3>
      
      <!-- Movement controls -->
      <div class="movement-controls">
        <button id="startBtn" class="btn-start">▶ START</button>
        <button id="stopBtn" class="btn-stop">■ STOP</button>
        <button id="resetBtn" class="btn-reset">↻ RESTART</button>
      </div>
      
      <div class="form-group">
        <label>Speed (km/h):</label>
        <input type="number" id="speed" value="100" min="1" max="1000" />
      </div>
      
      <div class="form-group">
        <label>Waypoints:</label>
        <div class="waypoint-help">Drag to reorder waypoints</div>
        <button id="pickWaypointPosition" class="pick-map-btn" style="margin-bottom: 8px; background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">
          📍 Add Waypoint from Map
        </button>
        <div id="waypointList" class="waypoint-list"></div>
        <button id="addWaypoint" class="btn-add-waypoint">+ Add Waypoint Manually</button>
      </div>
      
      <button id="applyRoute" class="btn-apply">Apply Route</button>
      
      <!-- Export/Import Section -->
      <div class="form-group" style="margin-top: 15px;">
        <label>Route Data:</label>
        <div style="display: flex; gap: 8px;">
          <button id="exportJSON" class="btn-export" title="Export as JSON">📥 JSON</button>
          <button id="exportKML" class="btn-export" title="Export as KML">📥 KML</button>
          <label for="importFile" class="btn-import" title="Import route">📤 Import</label>
          <input type="file" id="importFile" accept=".json,.kml" style="display: none;" />
        </div>
      </div>
    </div>
    
    <!-- Object Management panel -->
    <div id="objectPanel" class="object-panel">
      <h3>
        Object Management
        <button id="closeObjectPanel" class="close-panel-btn" title="Close Panel">×</button>
      </h3>
      
      <div class="form-group">
        <label>Create New Object:</label>
        <select id="objectType" class="object-select">
          <option value="point">Point</option>
          <option value="line">Line</option>
          <option value="polygon">Polygon</option>
          <option value="model">3D Model (GLTF/GLB)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Object Name:</label>
        <input type="text" id="objectName" placeholder="Enter object name" />
      </div>
      
      <!-- 3D Model File Upload -->
      <div class="form-group" id="modelFileGroup" style="display: none;">
        <label>3D Model Source:</label>
        <select id="modelSource" class="object-select">
          <option value="upload">Upload Custom Model</option>
          <option value="local">Use Local Model</option>
        </select>
      </div>
      
      <!-- Upload Custom Model -->
      <div class="form-group" id="modelUploadGroup" style="display: none;">
        <label>Upload File:</label>
        <input type="file" id="modelFile" accept=".gltf,.glb" class="file-input" />
        <small style="color: #999; font-size: 11px;">Supported: GLTF, GLB</small>
      </div>
      
      <!-- Local Model Selection -->
      <div class="form-group" id="modelLocalGroup" style="display: none;">
        <label>Select Local Model:</label>
        <select id="localModelSelect" class="object-select">
          <option value="/models/balloon.glb">Cesium Balloon 🎈</option>
          <option value="/models/aircraft.glb">Aircraft ✈️</option>
          <option value="/models/autopilot_aircraft__drone.glb">Autopilot Drone 🚁</option>
          <option value="/models/f16-c_falcon.glb">F-16 Falcon �️</option>
          <option value="/models/helicopter.glb">Mech Drone 🤖</option>
        </select>
        <small style="color: #999; font-size: 11px; margin-top: 5px; display: block;">
          📁 Models location: /public/models/
        </small>
      </div>
      
      <div class="form-group">
        <label>Position:</label>
        <button id="pickObjectPosition" class="pick-map-btn" style="margin-bottom: 8px; background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">
          📍 Pick from Map
        </button>
        <div class="position-inputs">
          <input type="number" id="objectLat" placeholder="Latitude" step="0.0001" />
          <input type="number" id="objectLon" placeholder="Longitude" step="0.0001" />
          <input type="number" id="objectAlt" placeholder="Altitude (m)" value="0" />
        </div>
      </div>
      
      <!-- Model Scale (only for 3D models) -->
      <div class="form-group" id="modelScaleGroup" style="display: none;">
        <label>Model Scale:</label>
        <input type="number" id="modelScale" placeholder="Scale" value="1" step="0.1" min="0.1" />
      </div>
      
      <div class="form-group" id="colorGroup">
        <label>Color:</label>
        <input type="color" id="objectColor" value="#FF9800" />
      </div>
      
      <!-- Object Groups -->
      <div class="form-group">
        <label>Group:</label>
        <select id="objectGroup" class="object-select">
          <option value="">No Group</option>
        </select>
        <button id="createGroup" class="btn-create-group">+ New Group</button>
      </div>
      
      <button id="createObject" class="btn-create-object">Create Object</button>
      
      <div class="form-group">
        <label>Groups:</label>
        <div id="groupList" class="group-list"></div>
      </div>
      
      <div class="form-group">
        <label>Existing Objects:</label>
        <div id="objectList" class="object-list"></div>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
